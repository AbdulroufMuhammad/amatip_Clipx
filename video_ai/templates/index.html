{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Video</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>Submit a YouTube Video for Processing</h1>

        <form id="upload-form">
            <label>Enter YouTube URL:</label>
            <input type="url" id="video-url" placeholder="https://youtube.com/..." required>

            <label>Clip Duration (seconds):</label>
            <input type="number" id="clip-duration" value="30" required>

            <label>Custom Clip Ranges (optional, format: `start-end,start-end`):</label>
            <input type="text" id="clip-ranges" placeholder="10-30,40-60">

            <button type="submit">Submit</button>
        </form>

        <div id="logs-section">
            <h2>Processing Logs</h2>
            <ul id="log-list"></ul>
        </div>

        <!-- <button id="view-processing-btn" style="display: none;">View Processing</button> -->
    </div>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
